_schema-version: 3.3.0
ID: nai-cap-suite-v2
description: A simple CAP project.
version: 1.0.0
modules:
  - name: nai-cap-suite-v2-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: nai-cap-suite-v2-postgres
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: nai-cap-suite-v2-postgres-deployer
    type: nodejs
    path: gen/pg
    requires:
      - name: nai-cap-suite-v2-postgres
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - command: npm start
          name: deploy-to-postgresql
  - name: nai-cap-suite-v2-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: nai-cap-suite-v2-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - naiapprovalmatrixappapprovalmatrix.zip
          name: naiapprovalmatrixappapprovalmatrix
          target-path: resources/
        - artifacts:
            - naireimbursementsappreimbursements.zip
          name: naireimbursementsappreimbursements
          target-path: resources/
        - artifacts:
            - naireimbursementsapprtmaintenance.zip
          name: naireimbursementsapprtmaintenance
          target-path: resources/
  - name: naiapprovalmatrixappapprovalmatrix
    type: html5
    path: app/approvalmatrix
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: naireimbursementsappreimbursements
    type: html5
    path: app/reimbursements
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: naireimbursementsapprtmaintenance
    type: html5
    path: app/rtmaintenance
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: nai-cap-suite-v2-postgres
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: development
  - name: nai-cap-suite-v2-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: nai-cap-suite-v2-html5-service
      service-plan: app-host
  - name: nai-cap-suite-v2-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: nai-cap-suite-v2-destination-service
      service-plan: lite
    requires:
      - name: srv-api
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
